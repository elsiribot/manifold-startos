name: Update manifold and release

on:
  schedule:
    # Hourly poll of fedibtc/manifold master. The poll job is cheap (one
    # ls-remote against flake.lock); the build job only runs on changes.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build and release even if the manifold pin is unchanged
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-release
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare upstream master against the flake pin
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          pinned=$(jq -r '.nodes.manifold.locked.rev' flake.lock)
          latest=$(git ls-remote https://github.com/fedibtc/manifold \
            refs/heads/master | cut -f1)
          echo "pinned=$pinned latest=$latest"
          if [ -z "$latest" ]; then
            echo "could not resolve upstream master" >&2
            exit 1
          fi
          if [ "$latest" = "$pinned" ] && [ "$FORCE" != "true" ]; then
            echo "manifold pin is current; nothing to do"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "manifold-${latest:0:7}" >/dev/null 2>&1 \
            && [ "$FORCE" != "true" ]; then
            echo "release manifold-${latest:0:7} already exists; nothing to do"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: poll
    if: needs.poll.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: pushing from a shallow clone is refused.
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump manifold input and package revision
        id: bump
        run: |
          nix flake update manifold
          rev=$(jq -r '.nodes.manifold.locked.rev' flake.lock)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "tag=manifold-${rev:0:7}" >> "$GITHUB_OUTPUT"
          # Strictly increasing package revision, unique per hourly build.
          stamp=$(date -u +%Y%m%d%H)
          sed -i -E "s/version: '([0-9.]+):[0-9]+'/version: '\1:$stamp'/" \
            startos/versions/current.ts
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add flake.lock startos/versions/current.ts
          git diff --cached --quiet || git commit -m "Bump manifold to $rev"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            podman squashfs-tools squashfs-tools-ng jq
          curl -fsSL https://start9.com/start-cli/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Init packaging workspace
        env:
          # Optional: a pinned ed25519 signing key (PKCS#8 PEM). Without it,
          # each run signs with a fresh workspace key, which is fine for
          # side-loading.
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          ws=$(dirname "$GITHUB_WORKSPACE")
          start-cli s9pk init-workspace "$ws"
          # start-cli resolves the default host target on startup; the
          # scaffold default dev-vm.local does not exist here.
          sed -i 's|default: https://dev-vm.local|default: https://localhost|' \
            "$ws/.startos/config.yaml"
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s\n' "$SIGNING_KEY" > "$ws/.startos/build.key.pem"
          fi

      - name: Build s9pk
        env:
          STARTOS_USE_PODMAN: '1'
        run: |
          npm ci
          make x86

      - name: Push and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:master
          version=$(start-cli s9pk inspect fleet-manager_x86_64.s9pk manifest \
            | jq -r .version)
          rev='${{ steps.bump.outputs.rev }}'
          tag='${{ steps.bump.outputs.tag }}'
          notes="Automated build of [fedibtc/manifold@$rev](https://github.com/fedibtc/manifold/commit/$rev) (package version $version, x86_64). Side-load the attached s9pk."
          gh release create "$tag" fleet-manager_x86_64.s9pk \
            --title "Fleet Manager $version ($tag)" \
            --notes "$notes" \
            || gh release upload "$tag" fleet-manager_x86_64.s9pk --clobber
