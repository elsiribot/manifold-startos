name: Update manifold and release

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build and release even if the manifold pin is unchanged
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: pushing from a shallow clone is refused.
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump manifold input
        id: bump
        env:
          FORCE: ${{ inputs.force }}
        run: |
          nix flake update manifold
          rev=$(jq -r '.nodes.manifold.locked.rev' flake.lock)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "tag=manifold-${rev:0:7}" >> "$GITHUB_OUTPUT"
          if ! git diff --quiet flake.lock || [ "$FORCE" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifold pin unchanged; nothing to do"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if the release already exists
        id: existing
        if: steps.bump.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          if gh release view "${{ steps.bump.outputs.tag }}" >/dev/null 2>&1 \
            && [ "$FORCE" != "true" ]; then
            echo "release ${{ steps.bump.outputs.tag }} already exists; nothing to do"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump package revision
        if: steps.existing.outputs.proceed == 'true'
        run: |
          today=$(date -u +%Y%m%d)
          sed -i -E "s/version: '([0-9.]+):[0-9]+'/version: '\1:$today'/" \
            startos/versions/current.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flake.lock startos/versions/current.ts
          git diff --cached --quiet || git commit -m \
            "Bump manifold to ${{ steps.bump.outputs.rev }}"

      - name: Install packaging tools
        if: steps.existing.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            podman squashfs-tools squashfs-tools-ng jq
          curl -fsSL https://start9.com/start-cli/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Init packaging workspace
        if: steps.existing.outputs.proceed == 'true'
        env:
          # Optional: a pinned ed25519 signing key (PKCS#8 PEM). Without it,
          # each run signs with a fresh workspace key, which is fine for
          # side-loading.
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          ws=$(dirname "$GITHUB_WORKSPACE")
          start-cli s9pk init-workspace "$ws"
          # start-cli resolves the default host target on startup; the
          # scaffold default dev-vm.local does not exist here.
          sed -i 's|default: https://dev-vm.local|default: https://localhost|' \
            "$ws/.startos/config.yaml"
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s\n' "$SIGNING_KEY" > "$ws/.startos/build.key.pem"
          fi

      - name: Build s9pk
        if: steps.existing.outputs.proceed == 'true'
        env:
          STARTOS_USE_PODMAN: '1'
        run: |
          npm ci
          make x86

      - name: Push and release
        if: steps.existing.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:master
          version=$(start-cli s9pk inspect fleet-manager_x86_64.s9pk manifest \
            | jq -r .version)
          notes="Automated build of \
          [fedibtc/manifold@${{ steps.bump.outputs.rev }}]\
          (https://github.com/fedibtc/manifold/commit/${{ steps.bump.outputs.rev }}) \
          (package version $version, x86_64). Side-load the attached s9pk."
          gh release create "${{ steps.bump.outputs.tag }}" \
            fleet-manager_x86_64.s9pk \
            --title "Fleet Manager $version (${{ steps.bump.outputs.tag }})" \
            --notes "$notes" \
            || gh release upload "${{ steps.bump.outputs.tag }}" \
              fleet-manager_x86_64.s9pk --clobber
